# Pre-built Grafana dashboard for the metrics the operator exports.
# See docs/metrics.md for import instructions.
#
# The grafana_dashboard label lets the Grafana sidecar pick the ConfigMap up
# automatically when that feature is enabled; otherwise import the JSON by hand.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: imagecertinfo-operator-dashboard
  labels:
    app.kubernetes.io/name: imagecertinfo-operator
    app.kubernetes.io/managed-by: kustomize
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Image Certification
data:
  dashboard.json: |
    {
      "uid": "imagecertinfo-operator",
      "title": "Image Certification Info Operator",
      "tags": [
        "imagecertinfo",
        "security"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "1m",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "label": "Prometheus",
            "type": "datasource",
            "query": "prometheus",
            "current": {},
            "hide": 0,
            "refresh": 1
          }
        ]
      },
      "annotations": {
        "list": []
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Images past EOL",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "description": "",
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "imagecertinfo_images_past_eol",
              "refId": "A",
              "legendFormat": "__auto",
              "instant": true,
              "range": false
            }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Critical vulnerabilities",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 0
          },
          "description": "",
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "imagecertinfo_vulnerabilities_total{severity=\"critical\"}",
              "refId": "A",
              "legendFormat": "__auto",
              "instant": true,
              "range": false
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Images grade F",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 12,
            "y": 0
          },
          "description": "",
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "imagecertinfo_images_by_health{grade=\"F\"}",
              "refId": "A",
              "legendFormat": "__auto",
              "instant": true,
              "range": false
            }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Pyxis cache hit ratio",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 18,
            "y": 0
          },
          "description": "",
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 50
                  },
                  {
                    "color": "green",
                    "value": 80
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(rate(imagecertinfo_pyxis_cache_hits_total{result=\"hit\"}[5m])) / clamp_min(sum(rate(imagecertinfo_pyxis_cache_hits_total[5m])), 0.000001) * 100",
              "refId": "A",
              "legendFormat": "__auto",
              "instant": true,
              "range": false
            }
          ]
        },
        {
          "id": 5,
          "type": "barchart",
          "title": "Certification status",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 4
          },
          "description": "Tracked images by certification status. Unknown usually means Pyxis has no record or the lookup failed.",
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "xField": "status"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (status) (imagecertinfo_images_total)",
              "refId": "A",
              "legendFormat": "{{status}}",
              "instant": true,
              "range": false
            }
          ]
        },
        {
          "id": 6,
          "type": "barchart",
          "title": "Images by health grade",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 4
          },
          "description": "Pyxis health grade. quay.io and non-Red Hat images have no grade.",
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "xField": "status"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (grade) (imagecertinfo_images_by_health)",
              "refId": "A",
              "legendFormat": "{{grade}}",
              "instant": true,
              "range": false
            }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Vulnerabilities by severity",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 12
          },
          "description": "Current totals summed across Pyxis certification data and Quay/Clair scans.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "fillOpacity": 10,
                "lineWidth": 2
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "imagecertinfo_vulnerabilities_total",
              "refId": "A",
              "legendFormat": "{{severity}}"
            }
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Images approaching EOL",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 12
          },
          "description": "Images grouped by how soon they reach end-of-life.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "fillOpacity": 10,
                "lineWidth": 2
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "imagecertinfo_images_eol_within_days",
              "refId": "A",
              "legendFormat": "within {{days}} days"
            }
          ]
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Pyxis requests per second",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 20
          },
          "description": "A success series that goes to zero while error rises means Pyxis is unavailable.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "fillOpacity": 10,
                "lineWidth": 2
              },
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (status) (rate(imagecertinfo_pyxis_requests_total[5m]))",
              "refId": "A",
              "legendFormat": "{{status}}"
            }
          ]
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Pyxis request latency (p95)",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 20
          },
          "description": "",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "fillOpacity": 10,
                "lineWidth": 2
              },
              "unit": "s"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "histogram_quantile(0.95, sum by (le, endpoint) (rate(imagecertinfo_pyxis_request_duration_seconds_bucket[5m])))",
              "refId": "A",
              "legendFormat": "{{endpoint}}"
            }
          ]
        }
      ]
    }
